name: contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Retec palette: teal cells from empty to busiest, coral snake
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#FF6B47&color_dots=#EBE9E3,#B8EDE2,#7DDCC9,#21C7A8,#149A82
            dist/snake-dark.svg?color_snake=#FF6B47&color_dots=#22262F,#0E4D42,#137A67,#1AA68C,#21C7A8

      # publishes dist/ to the output branch, served from raw.githubusercontent.com
      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
